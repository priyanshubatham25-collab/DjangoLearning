<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Student</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-red-500 via-pink-500 to-purple-600
             flex items-center justify-center p-6">

    <div class="w-full max-w-md">

        <!-- Delete Card -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 text-center
                    hover:-translate-y-1
                    transition-all duration-300">

            <!-- Warning Icon -->
            <div class="mx-auto mb-6
                        w-20 h-20
                        rounded-full
                        bg-red-100
                        flex items-center justify-center">

                <div class="w-14 h-14
                            rounded-full
                            bg-red-500
                            text-white
                            flex items-center justify-center
                            text-3xl">
                    !
                </div>

            </div>


            <!-- Heading -->
            <h2 class="text-3xl font-bold text-gray-800 mb-3">
                Delete Student?
            </h2>

            <p class="text-gray-500 mb-2">
                Are you sure you want to delete
            </p>

            <!-- Student Name -->
            <p class="text-xl font-bold text-red-600 mb-6">
                {{ student.name }}
            </p>

            <p class="text-sm text-gray-400 mb-8">
                This action cannot be undone.
            </p>


            <!-- Buttons -->
            <form method="POST" class="flex gap-3">
                {% csrf_token %}

                <!-- Delete Button -->
                <button
                    type="submit"
                    class="flex-1
                           bg-red-600
                           text-white
                           font-semibold
                           py-3
                           rounded-xl
                           shadow-lg
                           hover:bg-red-700
                           hover:shadow-xl
                           hover:scale-[1.02]
                           active:scale-95
                           transition-all duration-200"
                >
                    Yes, Delete
                </button>

                <!-- Cancel -->
                <a
                    href="{% url 'student_list' %}"
                    class="flex-1
                           bg-gray-100
                           text-gray-700
                           font-semibold
                           py-3
                           rounded-xl
                           hover:bg-gray-200
                           hover:scale-[1.02]
                           active:scale-95
                           transition-all duration-200"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
