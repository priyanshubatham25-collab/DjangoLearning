<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Added</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            animation: pop 0.5s ease-out;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center
             bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 p-6">

    <div class="bg-white/95 backdrop-blur-lg
                w-full max-w-md
                rounded-3xl
                shadow-2xl
                p-10
                text-center
                transition
                duration-300
                hover:-translate-y-2
                hover:shadow-3xl">

        <!-- Success Icon -->
        <div class="success-icon mx-auto mb-6
                    w-20 h-20
                    flex items-center justify-center
                    rounded-full
                    bg-green-100">

            <div class="w-14 h-14
                        flex items-center justify-center
                        rounded-full
                        bg-green-500
                        text-white
                        text-3xl">
                ✓
            </div>

        </div>

        <!-- Heading -->
        <h2 class="text-3xl font-bold text-gray-800 mb-3">
            Student Added!
        </h2>

        <!-- Message -->
        <p class="text-gray-500 mb-8">
            The student has been successfully added to the system.
        </p>

        <!-- Button -->
        <a
            href="{% url 'student_list' %}"
            class="group inline-flex items-center justify-center gap-2
                   w-full
                   bg-gradient-to-r from-blue-600 to-purple-600
                   text-white
                   font-semibold
                   py-3 px-6
                   rounded-xl
                   shadow-lg
                   hover:from-blue-700
                   hover:to-purple-700
                   hover:shadow-xl
                   hover:scale-[1.02]
                   active:scale-95
                   transition-all duration-200"
        >
            View Student List

            <span class="group-hover:translate-x-1 transition-transform">
                →
            </span>
        </a>


        <p class="text-xs text-gray-400 mt-6">
            Student Management System
        </p>

    </div>

</body>
</html>
