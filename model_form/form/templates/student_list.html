<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 p-6">
     <!-- Header -->
    <div class="shadow-xl p-6 mb-6
                    flex flex-col sm:flex-row
                    justify-between items-center gap-4">

         <div>
            <h1 class="text-3xl font-bold text-gray-800">
                 All Student Data
            </h1>

            <p class="text-gray-500 mt-1">
                 Manage all registered students
            </p>
        </div>

            <a
                href="{% url 'student_create' %}"
                class="bg-gradient-to-r from-blue-700 to-purple-700
                       text-white font-semibold
                       px-5 py-3 rounded-xl
                       shadow-lg
                       hover:scale-105
                       hover:shadow-xl
                       transition-all duration-200"
            >
                + Add Student
            </a>

        </div>

    <div class="max-w-5xl mx-auto">


          {% if students %}

        <!-- Student Cards -->
        <div class="grid gap-4">

            {% for s in students %}

            <div class="bg-white rounded-2xl shadow-lg p-5
                        flex flex-col md:flex-row
                        md:items-center md:justify-between
                        gap-4
                        hover:-translate-y-1
                        hover:shadow-2xl
                        transition-all duration-300">

                <!-- Student Info -->
                <a
                    href="{% url 'student_details' s.id %}"
                    class="flex-1"
                >
                    <h2 class="text-xl font-bold text-gray-800
                               hover:text-blue-600 transition">
                        {{ s.name }}
                    </h2>

                    <div class="flex flex-wrap gap-3 mt-2 text-sm text-gray-500">

                        <span class="bg-blue-50 text-blue-600
                                     px-3 py-1 rounded-full">
                            Age: {{ s.age }}
                        </span>

                        <span class="bg-purple-50 text-purple-600
                                     px-3 py-1 rounded-full">
                            {{ s.email }}
                        </span>

                    </div>
                </a>


                <!-- Actions -->
                <div class="flex gap-2">

                    <a
                        href="{% url 'student_details' s.id %}"
                        class="px-4 py-2 rounded-lg
                               bg-gray-100 text-gray-700
                               hover:bg-gray-200
                               transition"
                    >
                        View
                    </a>

                    <a
                        href="{% url 'student_edit' s.id %}"
                        class="px-4 py-2 rounded-lg
                               bg-yellow-100 text-yellow-700
                               hover:bg-yellow-200
                               transition"
                    >
                        Edit
                    </a>

                    <a
                        href="{% url 'student_delete' s.id %}"
                        class="px-4 py-2 rounded-lg
                               bg-red-100 text-red-600
                               hover:bg-red-200
                               transition"
                    >
                        Delete
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

        {% else %}

        <!-- Empty State -->
        <div class="bg-white rounded-2xl shadow-xl
                    p-12 text-center">

            <div class="text-6xl mb-4">
                👨‍🎓
            </div>

            <h2 class="text-2xl font-bold text-gray-800">
                No Students Yet
            </h2>

            <p class="text-gray-500 mt-2 mb-6">
                Start by adding your first student.
            </p>

            <a
                href="{% url 'student_create' %}"
                class="inline-block
                       bg-blue-600 text-white
                       px-6 py-3 rounded-xl
                       font-semibold
                       hover:bg-blue-700
                       hover:scale-105
                       transition"
            >
                + Add Student
            </a>

        </div>

        {% endif %}

    </div>

</body>
</html>
