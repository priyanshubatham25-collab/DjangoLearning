{% extends 'base.html' %} {% block content %}

<style>
  input,
  select,
  textarea {
    width: 100%;
    height: 50px;
    padding: 12px 14px;
    margin-top: 6px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    transition: 0.2s;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: #6366f1;
    padding: 20px;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  label {
    font-weight: 600;
    color: #374151;
  }

  ul.errorlist {
    color: #dc2626;
    font-size: 14px;
    margin-top: 5px;
  }
</style>

<div class="text-center mb-8">
  <div
    class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-lg shadow-indigo-200"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-8 w-8"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2.25-6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4.5 20.25a7.5 7.5 0 0115 0"
      />
    </svg>
  </div>

  <h2 class="text-3xl font-extrabold text-gray-800">Create Account</h2>

  <p class="mt-2 text-sm text-gray-500">Join us today and get started 🚀</p>
</div>

<!-- Form -->
<form
  action="{% url 'register' %}"
  method="POST"
  class="space-y-5"
  id="registerForm"
>
  {% csrf_token %}

  <div class="space-y-4">{{ form.as_p }}</div>

  <!-- Terms -->
  <div class="flex items-start gap-3 text-sm text-gray-500">
    <input
      type="checkbox"
      id="terms"
      required
      class="!mt-1 !h-4 !w-4 !p-0 !rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
    />

    <label for="terms" class="font-normal text-gray-500">
      I agree to the
      <a
        href="#"
        class="font-medium text-indigo-600 hover:text-indigo-700 hover:underline"
      >
        Terms & Conditions
      </a>
    </label>
  </div>

  <!-- Submit button -->
  <button
    type="submit"
    id="registerButton"
    class="group relative w-full overflow-hidden rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 px-4 py-3 font-semibold text-white shadow-lg shadow-indigo-200 transition-all duration-300 hover:-translate-y-0.5 hover:from-indigo-700 hover:to-purple-700 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-indigo-200 active:scale-[0.98]"
  >
    <span id="buttonText" class="flex items-center justify-center gap-2">
      Create Account
    </span>
  </button>
</form>

<!-- Login -->
<p class="mt-7 text-center text-sm text-gray-500">
  Already have an account?

  <a
    href="{% url 'login' %}"
    class="font-semibold text-indigo-600 transition hover:text-indigo-800 hover:underline"
  >
    Login
  </a>
</p>

{% endblock %}
